[project]
name = "splice-shortlist"
version = "0.1.0"
description = "Choose a scoring configuration for a fixed budget of MFASS-style splicing experiments"
requires-python = ">=3.11,<3.14"
# Pinned to the versions in rewire-benchmarks uv.lock at 093fd1a, which produced
# the published MFASS-v2 baseline, so the rerun is comparable.
dependencies = [
    "numpy==1.26.4",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
