name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.2"
      - run: make test
      - name: Validate archived metrics and manuscript tables
        run: |
          python3 scripts/paper_extract.py
          git diff --exit-code -- paper/generated/
